worker_processes  1;

error_log /opt/nginx/logs/error.log debug;

events {
  worker_connections  1024;
}

http {
  access_log /opt/nginx/logs/access.log;

  passenger_root /passenger;
  passenger_ruby /usr/bin/ruby3.3;

  include       mime.types;
  default_type  application/octet-stream;

  server {
    listen 0.0.0.0:8080;

    server_name passenger_buffering;
    root /srv/public;

    passenger_enabled on;
  }

  server {
    listen 0.0.0.0:8081;

    server_name passenger_no_buffering;
    root /srv/public;

    passenger_enabled on;
    passenger_request_buffering off;
  }
}
